[project]
name = "absorbobot"
version = "0.3.1"
description = "Telegram interface to Absorbent lecture notes."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp>=3.14,<4",
    "PyYAML",
    "psutil",
    "nvidia-ml-py",
    "yt-dlp[default]",
]

[project.scripts]
absorbobot = "absorbobot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/absorbobot"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
